# Production overrides: docker compose --env-file env/prod.env -p ayush-prod -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  frontend:
    restart: always
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }
  api:
    restart: always
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
  ml:
    restart: always
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
  db:
    restart: always
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
