apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: api-pvc, namespace: ayush }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: ayush }
spec:
  replicas: 1                      # SQLite file => keep a single replica
  strategy: { type: Recreate }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: local/ayush-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: ayush-config }
            - secretRef: { name: ayush-secret }
          volumeMounts: [{ name: data, mountPath: /app/data }]
          readinessProbe: { httpGet: { path: /health, port: 4000 }, initialDelaySeconds: 10 }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: api-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: ayush }
spec:
  selector: { app: api }
  ports: [{ port: 4000 }]
